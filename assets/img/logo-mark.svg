<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Établi">
  <!-- Établi : le plateau et ses deux pieds, l'accent aigu posé dessus comme un crayon de menuisier -->
  <defs>
    <linearGradient id="etabli-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4ebf3"/>
      <stop offset="1" stop-color="#9cb1cf"/>
    </linearGradient>
    <linearGradient id="etabli-pencil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b3abf5"/>
      <stop offset="1" stop-color="#6658d0"/>
    </linearGradient>
  </defs>
  <rect x="3" y="16" width="26" height="4.5" rx="1.6" fill="url(#etabli-wood)"/>
  <rect x="6.5" y="20" width="3.2" height="8" rx="1.1" fill="url(#etabli-wood)"/>
  <rect x="22.3" y="20" width="3.2" height="8" rx="1.1" fill="url(#etabli-wood)"/>
  <rect x="14.2" y="3.5" width="4.2" height="10" rx="1.6" fill="url(#etabli-pencil)" transform="rotate(32 16.3 8.5)"/>
</svg>
